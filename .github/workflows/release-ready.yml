# the release label says what merging publishes, so it is checked against the version and versionCode while it can still be fixed
name: release-ready

on:
  pull_request:
    branches: [production]
    # labeled and unlabeled re-run this when the label changes, or the check stays red after the fix
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the release is ready to cut
        env:
          GH_TOKEN: ${{ github.token }}
          WEB: "${{ contains(github.event.pull_request.labels.*.name, 'release: web') }}"
          APP: "${{ contains(github.event.pull_request.labels.*.name, 'release: app') }}"
        shell: bash
        run: |
          source scripts/version.sh
          VERSION=$(read_version)
          BASE=$(git show "origin/${GITHUB_BASE_REF}:frontend/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          NATIVE=$(read_native_version)
          BASE_NATIVE=$(read_native_version "origin/${GITHUB_BASE_REF}")
          echo "production is on ${BASE} with versionCode ${BASE_NATIVE}, this pull request is on ${VERSION} with versionCode ${NATIVE}"

          if [[ "${WEB}" == "true" && "${APP}" == "true" ]]; then
            echo "::error::release: web and release: app are both on this pull request. Keep release: app if versionCode went up, release: web if it did not."
            exit 1
          fi

          FAILED=0

          if [[ "${WEB}" != "true" && "${APP}" != "true" ]]; then
            if [[ "${VERSION}" != "${BASE}" ]]; then
              echo "::error::the version moves from ${BASE} to ${VERSION}, which only a release does. Label it release: web or release: app, as scripts/release.sh does."
              FAILED=1
            fi
            if [[ "${NATIVE}" != "${BASE_NATIVE}" ]]; then
              echo "::error::versionCode moves from ${BASE_NATIVE} to ${NATIVE}, so the native app changed and only an app release can ship it. Cut one with scripts/release.sh."
              FAILED=1
            fi
            if [[ "${FAILED}" == "0" ]]; then
              echo "not a release, so merging publishes nothing"
            fi
            exit "${FAILED}"
          fi

          # Equal means somebody forgot, lower means a bad merge. Neither can be published.
          if ! printf '%s\n%s\n' "${BASE}" "${VERSION}" | sort -C -V || [[ "${VERSION}" == "${BASE}" ]]; then
            echo "::error::the version is ${VERSION}, which is not above ${BASE}. Cut the release with scripts/release.sh, or remove the release label if this is not one."
            FAILED=1
          fi

          if [[ "${APP}" == "true" && "${NATIVE}" -le "${BASE_NATIVE}" ]]; then
            echo "::error::release: app needs versionCode in frontend/android/app/build.gradle above ${BASE_NATIVE}, and it is ${NATIVE}. Raise it, or use release: web if the native app did not change."
            FAILED=1
          fi

          if [[ "${WEB}" == "true" && "${NATIVE}" != "${BASE_NATIVE}" ]]; then
            echo "::error::versionCode moves from ${BASE_NATIVE} to ${NATIVE}, so the native app changed and this is release: app."
            FAILED=1
          fi

          # release.sh bumps both packages together, so a mismatch means one was edited by hand.
          BACKEND_VERSION=$(node -p "require('./backend/package.json').version")
          if [[ "${BACKEND_VERSION}" != "${VERSION}" ]]; then
            echo "::error::backend/package.json is on ${BACKEND_VERSION} but frontend/package.json is on ${VERSION}. They have to match."
            FAILED=1
          fi

          if ! grep -qE "^## \[${VERSION}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no dated '## [${VERSION}] - YYYY-MM-DD' heading."
            FAILED=1
          fi

          # Release prep empties it. Entries still sitting here mean the changelog is missing
          # something that is about to ship. Entries are indented and the headings they sit
          # under are not, so anchoring on the indent is what tells them apart.
          if grep -qE '^ {4,}- \S' devlog.txt; then
            echo "::error::devlog.txt still has entries, so they are not in the changelog."
            FAILED=1
          fi

          if ! python3 scripts/whatsnew.py check; then
            echo "::error::What's new still has upcoming highlights, so release prep did not stamp them with this version."
            FAILED=1
          fi

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::v${VERSION} has already been released. Pick a higher version."
            FAILED=1
          fi

          if [[ "${FAILED}" == "1" ]]; then
            exit 1
          fi
          echo "ready to release ${VERSION}"
