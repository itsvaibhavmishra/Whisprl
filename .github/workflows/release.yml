name: Release

# published only once every file it carries is built, since installed apps and download links read the latest release

on:
  push:
    branches: [production]
  # a release pull request is built ahead as a draft APK, so the release can be tried on a phone before it ships
  pull_request:
    branches: [production]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer push to rc replaces the test build, so one still building for an older commit is dropped
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.ref_name == 'production' ||
      (github.event.pull_request.head.ref == 'rc' && github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.labels.*.name, 'release: app') || contains(github.event.pull_request.labels.*.name, 'release: web')))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Plan the release
        id: plan
        run: |
          source scripts/version.sh
          VERSION=$(read_version)
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            LIVE=$(git show origin/production:frontend/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            # rc holds the version that will ship only once the prepare pull request has merged
            if [ "$VERSION" = "$LIVE" ]; then
              echo "::notice::rc is still on v$VERSION like production, so there is no release to try yet."
              exit 0
            fi
            echo "v$VERSION, test build"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "kind=test" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::notice::v$VERSION already released, bump the version to cut a new one."
            exit 0
          fi
          PREVIOUS=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          PREVIOUS_NATIVE=0
          if [ -n "$PREVIOUS" ]; then
            PREVIOUS_NATIVE=$(read_native_version "$PREVIOUS")
          fi
          KIND=web
          if [ "$(read_native_version)" -gt "$PREVIOUS_NATIVE" ]; then
            KIND=app
          fi
          echo "v$VERSION, release: $KIND"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - name: Check the secrets and settings
        if: steps.plan.outputs.version
        env:
          KIND: ${{ steps.plan.outputs.kind }}
          LIVE_UPDATE_KEY: ${{ secrets.LIVE_UPDATE_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RENDER_RC_DEPLOY_HOOK: ${{ secrets.RENDER_RC_DEPLOY_HOOK }}
          RC_API_ORIGIN: ${{ vars.RC_API_ORIGIN }}
        run: |
          NAMES="LIVE_UPDATE_KEY GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD"
          # a test build without the rc backend would quietly talk to production instead
          if [ "$KIND" = test ]; then
            NAMES="$NAMES RENDER_RC_DEPLOY_HOOK RC_API_ORIGIN"
          fi
          for name in $NAMES; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set, so nothing is published."
              exit 1
            fi
          done

      # rc's backend deploys only for a release's test build, at the commit the APK is built from
      - name: Deploy the rc backend
        if: steps.plan.outputs.kind == 'test'
        env:
          RENDER_RC_DEPLOY_HOOK: ${{ secrets.RENDER_RC_DEPLOY_HOOK }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: curl --fail --silent --show-error --output /dev/null -X POST "$RENDER_RC_DEPLOY_HOOK&ref=$SHA"

      - uses: actions/setup-node@v7
        if: steps.plan.outputs.version
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v6
        if: steps.plan.outputs.version
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install frontend
        if: steps.plan.outputs.version
        run: npm ci
        working-directory: frontend

      # built with the production settings the website uses, and signed with the key whose public half every APK carries
      - name: Build the live update
        if: steps.plan.outputs.version
        env:
          LIVE_UPDATE_KEY: ${{ secrets.LIVE_UPDATE_KEY }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          REACT_APP_SENTRY_DSN: ${{ vars.REACT_APP_SENTRY_DSN }}
          REACT_APP_NODE: ${{ vars.REACT_APP_NODE }}
          REACT_APP_API_ORIGIN: ${{ steps.plan.outputs.kind == 'test' && vars.RC_API_ORIGIN || vars.REACT_APP_API_ORIGIN }}
          REACT_APP_GA_ID: ${{ vars.REACT_APP_GA_ID }}
          REACT_APP_GOOGLE_AUTH_CLIENT_ID: ${{ vars.REACT_APP_GOOGLE_AUTH_CLIENT_ID }}
          REACT_APP_GITHUB_AUTH_CLIENT_ID: ${{ vars.REACT_APP_GITHUB_AUTH_CLIENT_ID }}
          REACT_APP_LINKEDIN_AUTH_CLIENT_ID: ${{ vars.REACT_APP_LINKEDIN_AUTH_CLIENT_ID }}
          REACT_APP_RECAPTCHA_CLIENT: ${{ vars.REACT_APP_RECAPTCHA_CLIENT }}
          REACT_APP_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/app-update.json
        run: |
          umask 077
          printf '%s\n' "$LIVE_UPDATE_KEY" > "$RUNNER_TEMP/live-update-key.pem"
          scripts/app-update.sh "$RUNNER_TEMP/live-update-key.pem" "$RUNNER_TEMP/release"

      # the same web build as the live update, so a new install starts on this version
      - name: Build the APK
        if: steps.plan.outputs.version
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          mkdir -p android/app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/src/release/google-services.json
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/whisprl-upload.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/whisprl-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=whisprl-upload
          keyPassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
          # the maps are already in Sentry, and on a phone they only make the download bigger
          find build -name '*.map' -delete
          npx cap sync android
          (cd android && ./gradlew assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/release/whisprl.apk"

      # Play takes each versionCode once, so only an app release has a bundle worth uploading
      - name: Build the Play bundle
        if: steps.plan.outputs.kind == 'app'
        working-directory: frontend
        run: |
          (cd android && ./gradlew bundleRelease)
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/release/whisprl-play.aab"

      - name: Publish the release
        if: steps.plan.outputs.version && steps.plan.outputs.kind != 'test'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          KIND: ${{ steps.plan.outputs.kind }}
        run: |
          ASSETS=("$RUNNER_TEMP/release/app-update.zip" "$RUNNER_TEMP/release/app-update.json" "$RUNNER_TEMP/release/whisprl.apk")
          if [ "$KIND" = app ]; then
            printf '**New app version.** Install `whisprl.apk` below: the app cannot update itself to this one.\n\n' > notes.md
            printf '`whisprl-play.aab` is for uploading to the Play Console. A phone cannot install it.\n\n' >> notes.md
            ASSETS+=("$RUNNER_TEMP/release/whisprl-play.aab")
          fi
          # the same script the release command uses, so the notes and the pull request body cannot drift apart
          python3 scripts/changelog.py section "$VERSION" >> notes.md
          gh release create "v$VERSION" --target "${{ github.sha }}" --title "Whisprl $VERSION" --notes-file notes.md "${ASSETS[@]}"
          gh release delete "test-v$VERSION" --yes 2>/dev/null || true

      # a draft is seen only by the repository's owners and never counts as the latest release, so no installed app reads it
      - name: Publish the test build
        if: steps.plan.outputs.kind == 'test'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh release delete "test-v$VERSION" --yes 2>/dev/null || true
          gh release create "test-v$VERSION" --draft --target "$SHA" --title "Whisprl $VERSION test build" \
            --notes "The release for v$VERSION as rc has it at ${SHA::7}, against the rc backend on Render. Install whisprl.apk over the app to try it before merging, and install v$VERSION's own whisprl.apk once it is out, since the app takes no live update at its own version. Replaced on every push to rc, and deleted once v$VERSION is released." \
            "$RUNNER_TEMP/release/whisprl.apk"
