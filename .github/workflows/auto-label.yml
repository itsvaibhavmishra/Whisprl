name: Auto Label PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  label:
    name: Label by branch prefix
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label PR based on branch name
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const labelMap = {
              'feat/':     'feature',
              'fix/':      'bug',
              'chore/':    'chore',
              'style/':    'style',
              'refactor/': 'refactor',
              'perf/':     'performance',
              'docs/':     'documentation',
              'test/':     'testing',
            };

            const label = Object.entries(labelMap).find(([prefix]) =>
              branch.startsWith(prefix)
            )?.[1];

            if (!label) return;

            // Ensure label exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
              });
            } catch {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: '0075ca',
              });
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });

            console.log(`Labelled PR with: ${label}`);
